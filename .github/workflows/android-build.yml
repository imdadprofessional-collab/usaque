name: Android Build (APK & AAB)

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK & release AAB
    runs-on: ubuntu-latest

    # The `secrets` context can't be referenced directly inside `if:` conditions —
    # GitHub's workflow parser rejects that ("Unrecognized named-value: 'secrets'").
    # Route anything we need to branch on through job-level env instead.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 used to handle this, but it unconditionally tries to
      # install the legacy "tools" package during its own setup, which Google has since removed
      # from the SDK repository entirely -- the action now fails outright with "Failed to find
      # package 'tools'" on every run, regardless of anything in this project. GitHub's own
      # ubuntu-latest runner image already ships a working Android SDK cmdline-tools install, so
      # this locates and drives that directly instead of depending on the broken action.
      - name: Locate Android sdkmanager
        run: |
          set -e
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not locate sdkmanager under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager at: $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Install required SDK packages
        run: "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # This repo ships a placeholder app/google-services.json so the Google Services plugin
      # has something to parse. If a real Firebase config is stored as a repo secret, use it
      # instead so builds exercise the real project.
      - name: Write real google-services.json (if configured)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Optional release signing. If these secrets aren't set, bundleRelease still succeeds
      # and produces an unsigned AAB (see the signingConfig guard in app/build.gradle.kts) —
      # you can sign it manually later, or add the secrets to sign it here directly.
      - name: Decode release keystore (if configured)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          echo "CDL_RELEASE_STORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          echo "CDL_RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CDL_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CDL_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cdl-permit-prep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: cdl-permit-prep-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
